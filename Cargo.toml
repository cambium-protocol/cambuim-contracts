[workspace]
resolver = "2"
members = [
    "shared",
    "registry",
    "credit-token",
    "zk-verifier",
    "marketplace",
    "retirement",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
soroban-sdk = "21"

# Required by `stellar contract build` to prevent silent integer overflow
# in Soroban contracts. Also applies overflow checks in WASM release builds.
[profile.release]
overflow-checks = true
opt-level = "z"
lto = true
codegen-units = 1
