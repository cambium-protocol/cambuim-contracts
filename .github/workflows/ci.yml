name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Format, Clippy, Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml in the repo root pins the channel, targets,
      # and components (including rust-src, required by soroban-sdk testutils).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32v1-none
          components: rustfmt,clippy,rust-src

      - name: Install system dependencies
        run: sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (all targets, warnings = errors)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build WASM artifacts
        run: stellar contract build

      - name: Run tests
        run: cargo test --locked --workspace

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32v1-none
          components: rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Run integration tests
        run: cargo test --locked -p integration-tests
