name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  STELLAR_CLI_VERSION: "27.0.0"

jobs:
  check:
    name: Format, Clippy, Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml in the repo root pins channel=stable,
      # targets=[wasm32v1-none], and components including rust-src.
      # rust-src is required by soroban-sdk's testutils feature.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32v1-none
          components: rustfmt,clippy,rust-src

      # Download the pre-built binary instead of compiling from source.
      # Building stellar-cli from source takes ~10 min and pulls in native
      # deps (libdbus, libudev, hidapi) that are not on the runner by default.
      - name: Install stellar-cli
        run: |
          curl -fsSL \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-v${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin stellar
          stellar --version

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (all targets, warnings = errors)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build WASM artifacts
        run: stellar contract build

      - name: Run tests
        run: cargo test --locked --workspace

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32v1-none
          components: rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Run integration tests
        run: cargo test --locked -p integration-tests
